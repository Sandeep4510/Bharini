name: Mobile regression tests

on:
  push:
  pull_request:

jobs:
  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test --workspace=mobile
      - run: npm exec --workspace=mobile -- tsc --noEmit
